
name: Swipe-T9 APK erstellen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode laden
        uses: actions/checkout@v5

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v3

      - name: Dokumente erzeugen
        run: ./gradlew generateDocs

      - name: Woerterbuecher pruefen
        run: ./gradlew validateLanguages

      - name: Sprachdateien vorbereiten
        run: ./gradlew buildDefinition buildDictionaryDownloads

      - name: Sprachdateien kopieren
        run: ./gradlew copyDownloadsToAssets

      - name: Dauerhaften Test-Signaturschluessel laden
        env:
          KEYSTORE_B64: ${{ secrets.SWIPE_T9_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "ERROR: Repository secret SWIPE_T9_DEBUG_KEYSTORE_B64 fehlt."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Android Test APK bauen
        run: ./gradlew assembleFullDebug

      - name: Version auslesen
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Swipe-T9-v${{ steps.version.outputs.name }}-APK
          path: app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: GitHub-Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          TAG="v${VERSION}"
          APK="Swipe-T9-v${VERSION}.apk"
          cp "$(ls app/build/outputs/apk/full/debug/*.apk | head -1)" "$APK"
          NOTES="Swipe-T9 ${TAG} (Branch ${GITHUB_REF_NAME}, Commit ${GITHUB_SHA::7}). Installieren: APK herunterladen und oeffnen. Updates installieren sich ueber die alte Version."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Swipe-T9 ${TAG}" --notes "$NOTES"
          fi
